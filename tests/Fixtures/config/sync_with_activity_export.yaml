daktela:
  instance_url: "https://test.daktela.com"
  access_token: "test-token"
  database: "test-db"

sync:
  batch_size: 50
  entities:
    activity:
      enabled: true
      direction: cc_to_crm
      mapping_file: "../mappings/activities.yaml"
      activity_types: [call]
      # Explicit: the state-store requirement keys off an EXPLICIT "now".
      initial_sync: now

webhook:
  secret: "test-secret"
