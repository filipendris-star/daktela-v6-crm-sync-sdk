entity: activity
# The CRM-side field carrying the Daktela activity id. This is the ONLY thing
# preventing duplicate CRM activities on a replayed window or a multi-event
# webhook call, and the check runs against the MAPPED CRM payload — so it must
# name a crm_field below, never a cc_field.
lookup_field: external_id
mappings:
  - cc_field: name
    crm_field: external_id

  - cc_field: title
    crm_field: subject

  - cc_field: time_start
    crm_field: start_time
    transformers:
      - name: date_format
        params: { from: "Y-m-d H:i:s", to: "c" }

  - cc_field: time_close
    crm_field: end_time
    transformers:
      - name: date_format
        params: { from: "Y-m-d H:i:s", to: "c" }

  - cc_field: direction
    crm_field: direction

  - cc_field: contact
    crm_field: contact_id

  # Multi-value: Daktela stores multiple tag values, CRM wants first only
  - cc_field: customFields.disposition
    crm_field: disposition
    multi_value:
      strategy: first
